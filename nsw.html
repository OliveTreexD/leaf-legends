{e:'🪵',t:'Eucalypts & angophoras: read the bark',g:['Eucalyptus','Corymbia','Angophora','Syncarpia','Lophostemon'],tips:['<b>Gum</b> – smooth bark shedding in patches or ribbons (Sydney blue gum, forest red gum, grey gum, scribbly gums).','<b>Ironbark</b> – rock-hard, dark, deeply furrowed (grey ironbark, mugga, narrow-leaved ironbark).','<b>Box</b> – short, flaky bark on the lower trunk (grey box, yellow box, white box).','<b>Stringybark & peppermint</b> – fibres you can pull off (Sydney peppermint, tallowwood, swamp mahogany).','<b>Bloodwood</b> – chequered bark that bleeds red kino (red bloodwood).','<b>Angophora</b> – OPPOSITE leaves and ribbed cups with no lid. Sydney red gum turns pink in spring.'],r:'Gums are smooth, irons are tough, strings pull off, boxes are rough!'},
{e:'📜',t:'Paperbarks & bottlebrushes',g:['Melaleuca'],tips:['Papery bark peeling in layers on the tree paperbarks.','Bottlebrush flowers – the stem keeps growing leaves beyond the brush.','Old woody capsules hug the stem in rows like beads.','All Callistemons are now Melaleucas – same plants, new name.'],r:'Paper bark + brush + beads = Melaleuca.'},
{e:'🍵',t:'Tea-trees & kunzeas',g:['Leptospermum','Kunzea','Austromyrtus','Backhousia','Syzygium','Tristaniopsis'],tips:['<b>Tea-trees</b> – small stiff leaves, white 5-petal flowers like tiny apple blossom, woody cups stay on.','<b>Kunzea</b> – fluffy flowers with long stamens.','Lemon-scented tea-tree: crush a leaf and smell lemon.','<b>Lilly pillies</b> – glossy opposite leaves and colourful fleshy fruit.'],r:'Apple blossom = tea-tree. Fluffy = kunzea. Glossy + fruit = lilly pilly.'},
{e:'💛',t:'Wattles',g:['Acacia'],tips:['Most leaves are phyllodes – flattened stalks with parallel veins.','Sydney green wattle, Parramatta wattle and sunshine wattle have feathery fern-like leaves instead.','Flowers are fluffy BALLS or RODS – note which!','Prickly Moses is spiny – look before you touch.'],r:'Balls or rods? Then check the pods.'},
{e:'🪥',t:'Protea family: waratah, grevilleas, hakeas, banksias',g:['Telopea','Grevillea','Hakea','Banksia','Lambertia','Persoonia','Isopogon','Lomatia','Xylomelum'],tips:['<b>Waratah</b> – big red dome of flowers ringed by red bracts. NSW emblem.','<b>Grevillea</b> – spider flowers with long hooked styles, soft pods.','<b>Hakea</b> – similar flowers but rock-hard woody beaked fruits.','<b>Banksia</b> – flowers packed into a candle, then woody cones.','<b>Mountain devil</b> – red tubes, then a horned woody fruit. <b>Geebungs</b> – yellow flowers, green fruits.'],r:'Spider = Grevillea. Hard beak = Hakea. Candle = Banksia. Crown = Waratah.'},
{e:'🎋',t:'She-oaks',g:['Casuarina','Allocasuarina'],tips:['She-oak needles are really branchlets – the true leaves are tiny teeth in rings at each joint.','Count the teeth: black she-oak 6–8, river oak 8–10, swamp oak 12–17.','Swamp oak grows in salty mud, river oak lines freshwater rivers.'],r:'Count the teeth to name the she-oak.'},
{e:'🌳',t:'Rainforest & street trees',g:['Ficus','Glochidion','Cupaniopsis','Elaeocarpus','Harpullia','Podocarpus','Brachychiton','Ceratopetalum','Pittosporum','Grevillea'],tips:['<b>Figs</b> – milky sap, figs on the branches. Port Jackson fig has rusty undersides.','<b>Tuckeroo and tulipwood</b> – orange capsules with black seeds.','<b>Blueberry ash</b> – fringed bells then blue berries.','<b>Flame tree and kurrajong</b> – boat-shaped pods with itchy hairs.','<b>NSW Christmas bush</b> – red sepals in December.'],r:'Figs ooze milk, tuckeroos wear orange.'},
{e:'🔔',t:'Heaths, correas & boronias',g:['Epacris','Correa','Boronia','Philotheca','Zieria'],tips:['<b>Fuchsia heath</b> – red tubes with white tips. <b>Coral heath</b> – tiny white bells.','<b>Correas</b> – opposite leaves and tube-shaped bells made of 4 joined petals.','<b>Boronia, wax flower and zieria</b> – citrus family, crush a leaf for a strong smell.'],r:'Bells everywhere: heaths are sharp, correas are soft, boronias smell.'},
{e:'🌼',t:'Daisies & flannel flowers',g:['Actinotus','Chrysocephalum','Xerochrysum','Brachyscome','Ozothamnus'],tips:['A daisy flower is really a head of many tiny flowers.','<b>Everlastings</b> – papery bracts that crackle and last when dried.','<b>Flannel flower</b> – soft grey felt, cream bracts with green tips.'],r:'Paper, buttons and flannel.'},
{e:'🌾',t:'Grasses vs sedges vs rushes',g:['Themeda','Poa','Microlaena','Rytidosperma','Imperata','Cymbopogon','Entolasia','Oplismenus','Sporobolus','Spinifex','Bothriochloa','Austrostipa','Dichelachne','Phragmites','Carex','Ficinia','Gahnia','Lepidosperma','Juncus','Baloskion','Cyperus'],tips:['<b>Grasses</b> – hollow round stems with knee-like joints, leaves in two rows.','<b>Sedges</b> (Carex, Gahnia, Cyperus) – solid stems, often triangular.','<b>Rushes</b> (Juncus) – round, pithy stems with tiny 6-part flowers.','Blady grass = silver cotton tops. Kangaroo grass = rusty drooping heads.'],r:'Sedges have edges, rushes are round, grasses have knees all the way to the ground!'},
{e:'🪻',t:'Strappy plant showdown',g:['Lomandra','Dianella','Xanthorrhoea','Patersonia','Doryanthes','Crinum','Cordyline','Thysanotus','Blandfordia','Bulbine'],tips:['<b>Lomandra</b> – leaf tip often has 2–3 tiny teeth, spiky cream flower heads.','<b>Dianella</b> – blue star flowers then glossy blue-purple berries.','<b>Grass-tree</b> – ball of fine stiff leaves, tall spear flower spike.','<b>Gymea lily</b> – giant rosette and a 5 m red flower stalk.','<b>Christmas bells</b> – red and yellow bells in December.'],r:'Teeth = Lomandra. Blue berries = Dianella. Spear = grass-tree.'},
{e:'🌿',t:'Fern finder',g:['Cyathea','Dicksonia','Blechnum','Doodia','Adiantum','Pteridium','Calochlaena','Sticherus','Gleichenia','Todea','Pellaea','Cheilanthes'],tips:['<b>Tree-ferns</b> – rough = knobbly, prickly; soft = hairy fibrous trunk; lacy = oval coin scars.','<b>Maidenhair</b> – shiny black wiry stems + fan leaflets.','<b>Bracken</b> = harsh triangle on one stalk. <b>False bracken</b> = the soft look-alike.','<b>Umbrella and coral ferns</b> – fronds that fork again and again.'],r:'Soft trunks hug, rough trunks prickle.'},
{e:'🌺',t:'Orchids & epiphytes',g:['Dendrobium','Platycerium','Asplenium','Pyrrosia','Cymbidium','Glossodia','Pterostylis'],tips:['Every orchid has one special petal: the lip.','<b>Rock orchid</b> – huge clumps with cream sprays. <b>Tongue orchid</b> – fleshy tongue leaves.','<b>Elkhorn</b> – antler fronds plus a shield. <b>Bird\'s nest</b> – a ring of glossy swords.'],r:'Tongues, antlers and nests.'},
{e:'🌊',t:'Coastal & saltmarsh survivors',g:['Carpobrotus','Tetragonia','Rhagodia','Sarcocornia','Avicennia','Aegiceras','Juncus','Sporobolus','Spinifex'],tips:['<b>Fleshy leaves</b> store water – pigface, warrigal greens, glasswort.','<b>Mangroves</b> – grey mangrove has snorkel roots, river mangrove has horn-shaped fruit.','<b>Runners</b> bind sand – spinifex, saltwater couch.'],r:'Fleshy, salty or snorkelling = coastal survivor.'},
{e:'🍇',t:'Vine giveaways',g:['Hardenbergia','Kennedia','Pandorea','Hibbertia','Clematis','Billardiera','Cissus','Eustrephus','Geitonoplesium','Smilax'],tips:['Fluffy seed heads + opposite 3-part leaves = Clematis.','Trumpet flowers + pinnate leaves = Pandorea.','Tendrils + grape berries = kangaroo vine.','Orange berries with black seeds = wombat berry.'],r:'Fluff, trumpets, grapes and peas.'},
{e:'💧',t:'Water plants',g:['Typha','Eleocharis','Machaerina','Ottelia','Nymphoides','Persicaria','Philydrum','Vallisneria'],tips:['<b>Floating</b> – marshwort and ottelia.','<b>Submerged</b> – ribbonweed.','<b>Emergent</b> – cumbungi (brown sausages), spike-rush, twig-rush, frogsmouth.'],r:'Float, sink or stand at the edge?'},
{e:'🌴',t:'Palms & cycads',g:['Livistona','Archontophoenix','Macrozamia','Lepidozamia'],tips:['<b>Fan palm</b> – cabbage-tree palm, round fan leaves with spiny stalks.','<b>Feather palm</b> – Bangalow palm, smooth green crownshaft.','<b>Cycads</b> – stiff glossy leaflets, cones in the centre, toxic seeds.'],r:'Fan, feather or cone?'}
];

 var p={id:sci,sci:sci,common:f[1]||sci,cat:c,tips:(f[2]||'').split(';').map(function(s){return s.trim()}).filter(Boolean),hook:f[3]||'',aka:(f[4]||'').split(',').map(function(s){return s.trim()}).filter(Boolean),q:q,cv:cv,note:f[6]||''};

/* ============ HELPERS & STATE ============ */
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function attr(s){return String(s).replace(/"/g,'&quot;')}
function genus(p){return p.sci.split(' ')[0]}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var S=Object.assign({box:{},fav:{},xp:0,best:{},streak:0,last:''},loadJSON('llnsw_state',{}));
function save(){store.set('llnsw_state',JSON.stringify(S))}
function lv(p){return S.box[p.id]||0}
function groupIdx(p){var g=genus(p);for(var i=0;i<GROUPS.length;i++)if(GROUPS[i].g.indexOf(g)>-1)return i;return -1}
function ico(t){t=t.toLowerCase();
 if(/bark|trunk/.test(t))return'🪵';
 if(/smell|scent|crush|lemon|mint|fragrant|sniff/.test(t))return'👃';
 if(/flower|brush|candle|plume|seed head|panicle|bell|trumpet|petal/.test(t))return'🌸';
 if(/fruit|berr|nut|pod|capsule|cone|fig|seed|grape/.test(t))return'🫐';
 if(/leaf|leaves|leaflet|frond|phyllode|needle|branchlet/.test(t))return'🍃';
 if(/grow|swamp|creek|river|coast|dune|rainforest|wet|water|rock|shade|beach|gully|gullies|forest|saltmarsh/.test(t))return'📍';
 if(/stem|cane|tendril|twin|climb|thorn|prickl|spine|runner/.test(t))return'🌱';
 return'👀'}
function stripP(t){return t.replace(/\s*\([^)]*\)/g,'')}
function tipsHTML(p,strip){return '<ol class="tips">'+p.tips.map(function(t){return '<li><span>'+ico(t)+'</span><div>'+(strip?stripP(t):t)+'</div></li>'}).join('')+'</ol>'}
function stats(){$('#stS').textContent=S.streak;$('#stX').textContent=S.xp;$('#stM').textContent=P.filter(function(p){return lv(p)>=3}).length+'/'+P.length}
function touch(){var d=new Date().toDateString();if(S.last===d)return;var y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=d;save();stats()}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1700)}
function confetti(n){n=n||18;var fx=$('#fx'),em=['🌿','🍃','🌸','✨','🌼','⭐'];for(var i=0;i<n;i++){(function(i){var s=document.createElement('span');s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.3+'s';s.style.fontSize=(1+Math.random())+'rem';fx.appendChild(s);setTimeout(function(){s.remove()},1800)})(i)}}
function deck(d){return P.filter(function(p){return d==='all'||(d==='fav'?S.fav[p.id]:p.cat===d)})}
function pickW(arr,avoid){var tot=0;var w=arr.map(function(p){var x=Math.pow(6-Math.min(5,lv(p)),2);if(p.id===avoid&&arr.length>1)x=0;tot+=x;return x});var r=Math.random()*tot;for(var i=0;i<arr.length;i++){r-=w[i];if(r<=0&&w[i]>0)return arr[i]}return arr.filter(function(p){return p.id!==avoid})[0]||arr[0]}
function deckSel(id){return '<select id="'+id+'"><option value="all">🌏 All plants ('+P.length+')</option><option value="fav">⭐ Favourites ('+Object.keys(S.fav).length+')</option>'+Object.keys(CATS).map(function(k){return '<option value="'+k+'">'+CATS[k][0]+' '+CATS[k][1]+' ('+P.filter(function(p){return p.cat===k}).length+')</option>'}).join('')+'</select>'}

/* ============ PHOTOS ============ */
var PC=loadJSON('llnsw_ph',{});
function savePC(){store.set('llnsw_ph',JSON.stringify(PC))}
var pend={},QQ=[],busy=false,fails=0,NET=true;
function tfetch(u){var c=window.AbortController?new AbortController():null;var t=setTimeout(function(){if(c)c.abort()},9000);
 return fetch(u,c?{signal:c.signal}:{}).then(function(r){clearTimeout(t);return r},function(e){clearTimeout(t);throw e})}
function showNet(on){$('#net').hidden=!on}
function getPhoto(p){
 if(Object.prototype.hasOwnProperty.call(PC,p.id))return Promise.resolve(PC[p.id]);
 if(!NET)return Promise.resolve(null);
 if(pend[p.id]){for(var i=0;i<QQ.length;i++)if(QQ[i].p===p){QQ.push(QQ.splice(i,1)[0]);break}return pend[p.id]}
 pend[p.id]=new Promise(function(res){QQ.push({p:p,res:res});pump()});return pend[p.id]}
async function pump(){if(busy)return;busy=true;
 while(QQ.length){
  if(!NET){while(QQ.length){var x=QQ.pop();delete pend[x.p.id];x.res(null)}break}
  var job=QQ.pop(),ph=null,ok=true;
  try{ph=await findPhoto(job.p);fails=0}catch(e){ok=false;fails++;if(fails>=3){NET=false;showNet(true)}}
  if(ok){PC[job.p.id]=ph;savePC()}
  delete pend[job.p.id];job.res(ph);await sleep(ok?450:150)}
 busy=false}
async function findPhoto(p){
 if(p.cv){var w=null;try{w=await wiki(p.sci.replace(/[‘’]/g,"'"))}catch(e){}if(w)return w}
 var r=await inat(p.q);if(r)return r;
 try{return await wiki(p.q)}catch(e){return null}}
async function inat(q){
 var r=await tfetch('https://api.inaturalist.org/v1/taxa/autocomplete?per_page=10&q='+encodeURIComponent(q));
 if(!r.ok)throw new Error('http '+r.status);var j=await r.json();
 var rs=(j.results||[]).filter(function(t){return t.default_photo&&(!t.iconic_taxon_name||t.iconic_taxon_name==='Plantae')});var lq=q.toLowerCase();
 var t=rs.filter(function(t){return t.name.toLowerCase()===lq})[0]||rs.filter(function(t){return (t.matched_term||'').toLowerCase()===lq})[0]||rs[0];
 return t?{id:t.id,u:t.default_photo.medium_url,a:t.default_photo.attribution,s:'iNaturalist'}:null}
async function wiki(q){
 var r=await tfetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q.replace(/ /g,'_')));
 if(!r.ok)return null;var j=await r.json();
 return j.thumbnail&&j.type!=='disambiguation'?{u:j.thumbnail.source,a:j.title,s:'Wikipedia'}:null}
async function getGallery(p){
 var ph=await getPhoto(p);if(!ph)return[];if(!ph.id)return[ph];
 var k='g:'+ph.id;if(PC[k])return PC[k];
 try{var j=await (await tfetch('https://api.inaturalist.org/v1/taxa/'+ph.id)).json();
  var arr=((j.results&&j.results[0]&&j.results[0].taxon_photos)||[]).slice(0,8).map(function(x){return{u:x.photo.medium_url.replace('/medium.','/large.'),a:x.photo.attribution,s:'iNaturalist'}});
  if(arr.length){PC[k]=arr;savePC();return arr}}catch(e){}
 return[ph]}
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);loadPh(e.target)}})},{rootMargin:'300px'}):{observe:function(el){loadPh(el)},unobserve:function(){}};
function loadPh(el){if(!el)return;var p=BY[el.getAttribute('data-id')];if(!p)return;getPhoto(p).then(function(ph){paint(el,ph,p)})}
function emoji(el,p){el.classList.remove('load');el.innerHTML='<span class="em">'+CATS[p.cat][0]+'</span>'}
function paint(el,ph,p){if(ph&&ph.u){var i=new Image();i.onload=function(){el.style.backgroundImage='url("'+ph.u+'")';el.classList.remove('load');el.innerHTML=''};i.onerror=function(){emoji(el,p)};i.src=ph.u}else emoji(el,p)}
$('#netRetry').onclick=function(){NET=true;fails=0;showNet(false);Object.keys(PC).forEach(function(k){if(PC[k]===null)delete PC[k]});go(V)};

 '<div class="row">Learning level: <span class="dots5">'+'●'.repeat(l)+'○'.repeat(5-l)+'</span>'+(lv(p)>=3?' 🏆':'')+'</div>'+
 '<div class="row"><button class="btn '+(S.fav[p.id]?'gold':'')+'" id="dF">'+(S.fav[p.id]?'⭐ Favourited':'☆ Favourite')+'</button><button class="btn p" id="dK">✅ I know this one</button></div>'+
 '<div class="row"><a class="btn" target="_blank" rel="noopener" href="https://www.inaturalist.org/taxa/search?q='+encodeURIComponent(p.q)+'">🌐 iNaturalist</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q='+encodeURIComponent(p.sci.replace(/[‘’']/g,''))+'">🖼️ More photos</a></div>'+
 '<div class="nav2"><button class="btn" id="dP" '+(dI?'':'disabled')+'>← Prev</button><span class="meta">'+(dI+1)+' / '+dList.length+'</span><button class="btn" id="dN" '+(dI<dList.length-1?'':'disabled')+'>Next →</button></div></div>';
 $('#sheetIn').scrollTop=0;
 $('#dx').onclick=closeD;
 $('#dF').onclick=function(){if(S.fav[p.id])delete S.fav[p.id];else{S.fav[p.id]=1;toast('⭐ Added to favourites')}save();drawD()};
 $('#dK').onclick=function(){S.box[p.id]=Math.max(3,lv(p));S.xp+=5;touch();save();stats();confetti(12);toast('🏆 Marked as mastered!');drawD()};
 $('#dP').onclick=function(){if(dI>0){dI--;drawD()}};
 $('#dN').onclick=function(){if(dI<dList.length-1){dI++;drawD()}};
 if(G)$('#dG').onclick=function(e){e.preventDefault();closeD();go('tricks');setTimeout(function(){var el=document.getElementById('tk'+gi);if(el)el.scrollIntoView()},80)};
 var gal=$('#gal');
 $('#gl').onclick=function(){gal.scrollLeft-=gal.clientWidth};
 $('#gr').onclick=function(){gal.scrollLeft+=gal.clientWidth};
 getGallery(p).then(function(arr){if(dList[dI]!==p)return;
  if(!arr.length){gal.innerHTML='<div class="ph"><span class="em">'+CATS[p.cat][0]+'</span></div>';$('#cap').textContent=NET?'No photo found – tap “More photos”.':'Photos unavailable right now – tap “More photos”.';return}
  gal.innerHTML=arr.map(function(x){return '<div class="ph" style="background-image:url(\''+x.u+'\')"></div>'}).join('');
  $('#gdots').innerHTML=arr.length>1?arr.map(function(_,i){return '<span class="'+(i?'':'on')+'"></span>'}).join(''):'';
  var cap=function(i){var x=arr[i];$('#cap').textContent='📷 '+(x.a||'')+' · via '+x.s+(p.cv&&x.s==='iNaturalist'?' · may show the parent/related species':'');$$('#gdots span').forEach(function(d,j){d.classList.toggle('on',j===i)})};
  cap(0);gal.onscroll=function(){cap(Math.min(arr.length-1,Math.round(gal.scrollLeft/gal.clientWidth)))}})}
$('#sheet').onclick=function(e){if(e.target.id==='sheet')closeD()};

/* ============ FLASHCARDS ============ */
var L={deck:'all',mode:'photo',p:null,flip:false,last:null,h:0};
function renderLearn(){var D=deck(L.deck),m=D.filter(function(p){return lv(p)>=3}).length;
 $('#v-learn').innerHTML='<div class="panel"><div class="sel">'+deckSel('lDeck')+'<select id="lMode"><option value="photo">📸 Photo → name</option><option value="name">🔤 Name → features</option></select></div><div class="prog"><div style="width:'+(D.length?m/D.length*100:0)+'%"></div></div><div class="meta" style="margin:6px 0 0">🏆 '+m+' / '+D.length+' mastered · tap the card to flip · missed cards come back more often</div></div><div id="fcWrap"></div>';
 $('#lDeck').value=L.deck;$('#lMode').value=L.mode;
 $('#lDeck').onchange=function(e){L.deck=e.target.value;renderLearn()};
 $('#lMode').onchange=function(e){L.mode=e.target.value;renderLearn()};
 var W=$('#fcWrap');if(!D.length){W.innerHTML='<p class="empty">No plants in this deck yet – ⭐ some favourites first!</p>';return}
 var p=L.p=pickW(D,L.last);L.last=p.id;L.flip=false;L.h=0;
 var front=L.mode==='photo'
  ?'<div class="ph load" data-id="'+attr(p.id)+'"></div><div class="lbl"><div class="bigname">Who am I? 🤔</div><div class="hint" id="hint">Tap the card to reveal</div><button class="btn" id="hintBtn">💡 Give me a clue</button></div>'
  :'<div class="lbl" style="padding:40px 14px"><div class="big">'+CATS[p.cat][0]+'</div><div class="bigname">'+p.common+'</div><div class="sci">'+p.sci+'</div><p class="hint">Picture it… which 3 features would you look for? Then tap to flip.</p></div>';
 W.innerHTML='<div class="flash"><div class="fc" id="fc"><div class="face front">'+front+'</div><div class="face back"><div class="ph load" data-id="'+attr(p.id)+'"></div><div class="pad"><div class="bigname">'+p.common+'</div><div class="sci">'+p.sci+'</div><div style="margin-top:10px">'+tipsHTML(p)+'</div>'+(p.hook?'<div class="hook">🧠 '+p.hook+'</div>':'')+'</div></div></div>'+
  '<div class="ans" id="ans" style="visibility:hidden"><button class="btn red" id="again">😅 Again</button><button class="btn p" id="got">😎 Got it!</button></div></div>';
 $$('#fcWrap .ph').forEach(loadPh);
 $('#fc').onclick=flip;
 var hb=$('#hintBtn');if(hb)hb.onclick=function(e){e.stopPropagation();var t=p.tips[L.h++];if(t)$('#hint').innerHTML+='<div>'+ico(t)+' '+stripP(t)+'</div>';if(L.h>=p.tips.length)hb.style.display='none'};
 $('#again').onclick=function(){S.box[p.id]=0;touch();save();stats();renderLearn();window.scrollTo(0,0)};
 $('#got').onclick=function(){var b=lv(p);S.box[p.id]=Math.min(5,b+1);S.xp+=2;if(b<3&&b+1>=3){confetti();toast('🏆 Mastered: '+p.common)}touch();save();stats();renderLearn();window.scrollTo(0,0)}}
function flip(){var fc=$('#fc');if(!fc)return;L.flip=!L.flip;fc.classList.toggle('flip',L.flip);if(L.flip)$('#ans').style.visibility='visible'}

/* ============ QUIZ ============ */
var QZ={deck:'all',mode:'photo',done:true};
function renderQuiz(){var k=QZ.deck+'|'+QZ.mode;QZ.done=true;
 $('#v-quiz').innerHTML='<div class="panel center"><div class="big">🎯</div><h2>Plant Quiz</h2><p class="meta">10 questions. Wrong answers come from the same group, so look closely!</p><div class="sel" style="justify-content:center">'+deckSel('qDeck')+'<select id="qMode"><option value="photo">📸 Photo quiz</option><option value="clue">🔍 Clue quiz (no photo)</option></select></div><div class="row" style="justify-content:center"><button class="btn p" id="qGo">▶ Start quiz</button></div><p class="meta">Best score for this setup: '+(S.best[k]||0)+'/10</p></div>';
 $('#qDeck').value=QZ.deck;$('#qMode').value=QZ.mode;
 $('#qDeck').onchange=function(e){QZ.deck=e.target.value;renderQuiz()};
 $('#qMode').onchange=function(e){QZ.mode=e.target.value;renderQuiz()};
 $('#qGo').onclick=function(){if(!deck(QZ.deck).length){toast('That deck is empty!');return}
  if(!NET&&QZ.mode==='photo'){QZ.mode='clue';toast('Photos unavailable – using the clue quiz')}
  QZ.n=0;QZ.score=0;QZ.run=0;QZ.used={};QZ.missed=[];qNext()}}
function makeOpts(c){var pool=P.filter(function(p){return p.id!==c.id&&p.common!==c.common});
 var out=shuffle(pool.filter(function(p){return genus(p)===genus(c)})).slice(0,1);
 var cand=shuffle(pool.filter(function(p){return p.cat===c.cat})).concat(shuffle(pool));
 for(var i=0;i<cand.length&&out.length<3;i++){var p=cand[i];if(out.indexOf(p)<0&&!out.some(function(o){return o.common===p.common}))out.push(p)}
 return shuffle([c].concat(out))}
function qNext(){if(QZ.n>=10)return qEnd();
 var D=deck(QZ.deck).filter(function(p){return !QZ.used[p.id]});if(!D.length)D=deck(QZ.deck);
 var c=QZ.cur=pickW(D);QZ.used[c.id]=1;QZ.opts=makeOpts(c);QZ.done=false;QZ.n++;
 var body=QZ.mode==='photo'?'<div class="qimg"><div class="ph load" data-id="'+attr(c.id)+'"></div></div>':'<div class="panel" style="max-width:520px;margin:0 auto"><b>Which plant matches these clues?</b><div style="margin-top:8px">'+tipsHTML(c,true)+'</div></div>';
 $('#v-quiz').innerHTML='<div class="qtop"><span>Question '+QZ.n+'/10</span><span>✅ '+QZ.score+' · 🔥 '+QZ.run+'</span></div>'+body+'<div class="opts">'+QZ.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'"><b>'+o.common+'</b><i>'+o.sci+'</i></button>'}).join('')+'</div><div id="qFb"></div>';
 $$('#v-quiz .ph').forEach(loadPh);
 $$('.opt').forEach(function(b){b.onclick=function(){qAns(+b.getAttribute('data-i'))}});
 window.scrollTo(0,0)}
function qAns(i){if(QZ.done)return;QZ.done=true;var c=QZ.cur,o=QZ.opts[i],btns=$$('.opt');
 btns[QZ.opts.indexOf(c)].classList.add('ok');var right=o===c;
 if(right){QZ.score++;QZ.run++;S.xp+=10+(QZ.run>2?5:0);S.box[c.id]=Math.min(5,lv(c)+1);confetti()}
 else{btns[i].classList.add('no');QZ.run=0;QZ.missed.push(c);S.box[c.id]=0}
 touch();save();stats();
 $('#qFb').innerHTML=(QZ.mode==='clue'?'<div class="qimg" style="max-width:320px;margin:14px auto 0"><div class="ph load" data-id="'+attr(c.id)+'"></div></div>':'')+
  '<div class="hook" style="max-width:520px;margin:14px auto 0">'+(right?'🎉 Correct!'+(QZ.run>2?' 🔥 Streak bonus!':''):'❌ It was <b>'+c.common+'</b>.')+'<br>🧠 '+c.hook+'</div>'+
  '<div class="row" style="justify-content:center"><button class="btn" id="qInfo">📖 Details</button><button class="btn p" id="qNx">'+(QZ.n>=10?'See results 🏁':'Next ➜')+'</button></div>';
 $$('#qFb .ph').forEach(loadPh);
 $('#qInfo').onclick=function(){openD(c.id)};$('#qNx').onclick=qNext;
 try{$('#qNx').scrollIntoView({block:'center'})}catch(e){}}
function qEnd(){var k=QZ.deck+'|'+QZ.mode,old=S.best[k]||0,nb=QZ.score>old;S.best[k]=Math.max(old,QZ.score);save();QZ.done=true;
 var s=QZ.score,msg=s===10?'PERFECT! You are a Leaf Legend!':s>=8?'Brilliant work!':s>=5?'Growing nicely!':'Every expert started as a seedling!';
 if(s>=8)confetti(40);
 $('#v-quiz').innerHTML='<div class="panel center"><div class="big">'+(s>=8?'🏆':s>=5?'🌿':'🌱')+'</div><h2>'+s+' / 10</h2><p>'+msg+'</p>'+(nb?'<p><b>🎉 New best score!</b></p>':'<p class="meta">Best: '+S.best[k]+'/10</p>')+'<div class="row" style="justify-content:center"><button class="btn p" id="qAgain">🔁 Play again</button><button class="btn" id="qHome">⚙️ Change quiz</button></div></div>'+(QZ.missed.length?'<h3>📚 Revise these</h3><div class="grid" id="qMiss">'+QZ.missed.map(card).join('')+'</div>':'');
 $('#qAgain').onclick=function(){QZ.n=0;QZ.score=0;QZ.run=0;QZ.used={};QZ.missed=[];qNext()};
 $('#qHome').onclick=renderQuiz;
 var m=$('#qMiss');if(m){$$('#qMiss .ph').forEach(loadPh);var ml=QZ.missed.slice();m.onclick=function(e){var c=e.target.closest('.card');if(c)openD(c.getAttribute('data-id'),ml)}}
 window.scrollTo(0,0)}

/* ============ TRICKS ============ */
function renderTricks(){
 $('#v-tricks').innerHTML='<div class="tk" style="background:linear-gradient(135deg,#e3f1e6,#fff)"><h4>🧭 The 4-step ID method</h4><ol>'+
 '<li><b>🌳 Shape</b> – tree, shrub, groundcover, grass-like, vine, fern or palm?</li>'+
 '<li><b>🍃 Leaves</b> – opposite, alternate or whorled? Whole or divided? Crush and sniff!</li>'+
 '<li><b>🪵 Bark & stems</b> – smooth, papery, stringy, furrowed, corky, prickly? Grass stems: triangle, round or jointed?</li>'+
 '<li><b>🌸 Flowers & fruit</b> – ball, rod, brush, pea, bell, star? What\'s left behind: gumnuts, pods, berries, cones?</li></ol>'+
 '<div class="rhyme">🎵 Learn the GROUP first (below), then the species. It halves the work!</div></div>'+
 GROUPS.map(function(G,i){return '<div class="tk" id="tk'+i+'"><h4>'+G.e+' '+G.t+'</h4><ul>'+G.tips.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul><div class="rhyme">🎵 '+G.r+'</div><div class="row"><button class="btn" data-g="'+i+'">See these plants ('+P.filter(function(p){return G.g.indexOf(genus(p))>-1}).length+') →</button></div></div>'}).join('')+
 '<div class="tk"><h4>⚙️ About & settings</h4><p class="meta">Native plants of New South Wales, from Sydney sandstone to the tablelands and coast. Photos load live from iNaturalist (Wikipedia as backup) and are remembered on this device. Credits appear under each photo.</p><div class="row"><button class="btn red" id="reset">Reset my progress</button></div></div>';
 $$('[data-g]').forEach(function(b){b.onclick=function(){fGroup=GROUPS[+b.getAttribute('data-g')];fText='';$('#q').value='';go('explore')}});
 $('#reset').onclick=function(){if(confirm('Reset all progress, XP and favourites?')){S.box={};S.fav={};S.xp=0;S.best={};S.streak=0;S.last='';save();stats();toast('Progress reset 🌱')}}}

/* ============ NAV & INIT ============ */
function go(v){V=v;
 $$('.view').forEach(function(x){x.classList.toggle('on',x.id==='v-'+v)});
 $$('nav button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===v)});
 ({explore:renderExplore,learn:renderLearn,quiz:renderQuiz,tricks:renderTricks})[v]();window.scrollTo(0,0)}
$$('nav button').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-v'))}});
document.addEventListener('keydown',function(e){
 if($('#sheet').classList.contains('open')){if(e.key==='Escape')closeD();if(e.key==='ArrowRight'&&dI<dList.length-1){dI++;drawD()}if(e.key==='ArrowLeft'&&dI>0){dI--;drawD()}return}
 if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
 if(V==='learn'&&$('#fc')){if(e.key===' '){e.preventDefault();flip()}if(L.flip&&e.key==='1')$('#again').click();if(L.flip&&e.key==='2')$('#got').click()}
 if(V==='quiz'&&!QZ.done&&/^[1-4]$/.test(e.key))qAns(+e.key-1)});
stats();renderExplore();
</script>
</body>
</html>
