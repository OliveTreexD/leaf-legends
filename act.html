  if(!NET){while(QQ.length){var x=QQ.pop();delete pend[x.p.id];x.res(null)}break}
  var job=QQ.pop(),ph=null,ok=true;
  try{ph=await findPhoto(job.p);fails=0}catch(e){ok=false;fails++;if(fails>=3){NET=false;showNet(true)}}
  if(ok){PC[job.p.id]=ph;savePC()}
  delete pend[job.p.id];job.res(ph);await sleep(ok?450:150)}
 busy=false}
async function findPhoto(p){
 if(p.cv){var w=null;try{w=await wiki(p.sci.replace(/[‘’]/g,"'"))}catch(e){}if(w)return w}
 var r=await inat(p.q);if(r)return r;
 try{return await wiki(p.q)}catch(e){return null}}
async function inat(q){
 var r=await tfetch('https://api.inaturalist.org/v1/taxa/autocomplete?per_page=10&q='+encodeURIComponent(q));
 if(!r.ok)throw new Error('http '+r.status);var j=await r.json();
 var rs=(j.results||[]).filter(function(t){return t.default_photo&&(!t.iconic_taxon_name||t.iconic_taxon_name==='Plantae')});var lq=q.toLowerCase();
 var t=rs.filter(function(t){return t.name.toLowerCase()===lq})[0]||rs.filter(function(t){return (t.matched_term||'').toLowerCase()===lq})[0]||rs[0];
 return t?{id:t.id,u:t.default_photo.medium_url,a:t.default_photo.attribution,s:'iNaturalist'}:null}
async function wiki(q){
 var r=await tfetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q.replace(/ /g,'_')));
 if(!r.ok)return null;var j=await r.json();
 return j.thumbnail&&j.type!=='disambiguation'?{u:j.thumbnail.source,a:j.title,s:'Wikipedia'}:null}
async function getGallery(p){
 var ph=await getPhoto(p);if(!ph)return[];if(!ph.id)return[ph];
 var k='g:'+ph.id;if(PC[k])return PC[k];
 try{var j=await (await tfetch('https://api.inaturalist.org/v1/taxa/'+ph.id)).json();
  var arr=((j.results&&j.results[0]&&j.results[0].taxon_photos)||[]).slice(0,8).map(function(x){return{u:x.photo.medium_url.replace('/medium.','/large.'),a:x.photo.attribution,s:'iNaturalist'}});
  if(arr.length){PC[k]=arr;savePC();return arr}}catch(e){}
 return[ph]}
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);loadPh(e.target)}})},{rootMargin:'300px'}):{observe:function(el){loadPh(el)},unobserve:function(){}};
function loadPh(el){if(!el)return;var p=BY[el.getAttribute('data-id')];if(!p)return;getPhoto(p).then(function(ph){paint(el,ph,p)})}
function emoji(el,p){el.classList.remove('load');el.innerHTML='<span class="em">'+CATS[p.cat][0]+'</span>'}
function paint(el,ph,p){if(ph&&ph.u){var i=new Image();i.onload=function(){el.style.backgroundImage='url("'+ph.u+'")';el.classList.remove('load');el.innerHTML=''};i.onerror=function(){emoji(el,p)};i.src=ph.u}else emoji(el,p)}
$('#netRetry').onclick=function(){NET=true;fails=0;showNet(false);Object.keys(PC).forEach(function(k){if(PC[k]===null)delete PC[k]});go(V)};

/* ============ EXPLORE ============ */

function renderExplore(){
 var items=[['all','🌏 All'],['fav','⭐ Favourites'],['todo','📚 Still learning']].concat(Object.keys(CATS).map(function(k){return [k,CATS[k][0]+' '+CATS[k][1]]}));
 $('#chips').innerHTML=(fGroup?'<button class="chip on" data-c="__g">✕ '+fGroup.e+' '+fGroup.t+'</button>':'')+items.map(function(it){return '<button class="chip '+(fCat===it[0]&&!fGroup?'on':'')+'" data-c="'+it[0]+'">'+it[1]+'</button>'}).join('');
 var t=fText.toLowerCase().trim();
 list=P.filter(function(p){
  if(fGroup){if(fGroup.g.indexOf(genus(p))<0)return false}
  else{if(fCat==='fav'&&!S.fav[p.id])return false;if(fCat==='todo'&&lv(p)>=3)return false;if(CATS[fCat]&&p.cat!==fCat)return false}
  if(t){var hay=(p.sci+' '+p.common+' '+p.aka.join(' ')+' '+p.tips.join(' ')+' '+p.hook).toLowerCase();return t.split(/\s+/).every(function(w){return hay.indexOf(w)>-1})}
  return true});
 $('#meta').textContent=list.length+' plant'+(list.length===1?'':'s')+' · tap a card for photos & ID clues';
 $('#grid').innerHTML=list.map(card).join('')||'<p class="empty">No matches 🌱 Try another word.</p>';
 $$('#grid .ph').forEach(function(el){io.observe(el)});
 if(t||fGroup||fCat!=='all'){$('#potd').innerHTML='';return}
 var p=P[(Math.floor(Date.now()/864e5)*7919)%P.length];
 $('#potd').innerHTML='<div class="potd" data-id="'+attr(p.id)+'"><div class="ph load" data-id="'+attr(p.id)+'"></div><div><small>🌟 Plant of the day</small><b>'+p.common+'</b><i>'+p.sci+'</i><p>🧠 '+p.hook+'</p></div></div>';
 loadPh($('#potd .ph'))}
var tm;$('#q').addEventListener('input',function(e){clearTimeout(tm);tm=setTimeout(function(){fText=e.target.value;renderExplore()},180)});
$('#chips').onclick=function(e){var c=e.target.closest('.chip');if(!c)return;fGroup=null;if(c.getAttribute('data-c')!=='__g')fCat=c.getAttribute('data-c');renderExplore()};
$('#grid').onclick=function(e){var c=e.target.closest('.card');if(c)openD(c.getAttribute('data-id'),list)};
$('#potd').onclick=function(e){var c=e.target.closest('.potd');if(c)openD(c.getAttribute('data-id'))};

/* ============ DETAIL SHEET ============ */
var dList=[],dI=0;
function openD(id,lst){dList=lst&&lst.length?lst:[BY[id]];dI=0;for(var i=0;i<dList.length;i++)if(dList[i].id===id){dI=i;break}drawD();$('#sheet').classList.add('open');document.body.style.overflow='hidden'}
function closeD(){$('#sheet').classList.remove('open');document.body.style.overflow='';if(V==='explore')renderExplore()}
function drawD(){var p=dList[dI],gi=groupIdx(p),G=GROUPS[gi],l=Math.min(lv(p),5);
 $('#sheetIn').innerHTML='<button class="x" id="dx">✕</button>'+
 '<div style="position:relative"><div class="gal" id="gal"><div class="ph load"></div></div><button class="gbtn l" id="gl">‹</button><button class="gbtn r" id="gr">›</button></div>'+
 '<div class="galnav" id="gdots"></div><div class="cap" id="cap"></div><div class="pad">'+
 '<span class="badge">'+CATS[p.cat][0]+' '+CATS[p.cat][1]+'</span><h2>'+p.common+'</h2><div class="sci">'+p.sci+'</div>'+
 (p.aka.length?'<div class="aka">Also known as: <i>'+p.aka.join(', ')+'</i></div>':'')+
 '<h3>🔍 How to spot it</h3>'+tipsHTML(p)+
 (p.hook?'<div class="hook">🧠 <b>Memory hook:</b> '+p.hook+'</div>':'')+
 (p.note?'<div class="note">⚠️ '+p.note+'</div>':'')+
 (G?'<div class="trick">💡 <b>Group trick – '+G.e+' '+G.t+'</b><div style="margin:4px 0">'+G.r+'</div><a href="#" id="dG">See the full cheat sheet →</a></div>':'')+
 '<div class="row">Learning level: <span class="dots5">'+'●'.repeat(l)+'○'.repeat(5-l)+'</span>'+(lv(p)>=3?' 🏆':'')+'</div>'+
 '<div class="row"><button class="btn '+(S.fav[p.id]?'gold':'')+'" id="dF">'+(S.fav[p.id]?'⭐ Favourited':'☆ Favourite')+'</button><button class="btn p" id="dK">✅ I know this one</button></div>'+
 '<div class="row"><a class="btn" target="_blank" rel="noopener" href="https://www.inaturalist.org/taxa/search?q='+encodeURIComponent(p.q)+'">🌐 iNaturalist</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q='+encodeURIComponent(p.sci.replace(/[‘’']/g,''))+'">🖼️ More photos</a></div>'+
 '<div class="nav2"><button class="btn" id="dP" '+(dI?'':'disabled')+'>← Prev</button><span class="meta">'+(dI+1)+' / '+dList.length+'</span><button class="btn" id="dN" '+(dI<dList.length-1?'':'disabled')+'>Next →</button></div></div>';
 $('#sheetIn').scrollTop=0;
 $('#dx').onclick=closeD;
 $('#dF').onclick=function(){if(S.fav[p.id])delete S.fav[p.id];else{S.fav[p.id]=1;toast('⭐ Added to favourites')}save();drawD()};
 $('#dK').onclick=function(){S.box[p.id]=Math.max(3,lv(p));S.xp+=5;touch();save();stats();confetti(12);toast('🏆 Marked as mastered!');drawD()};
 $('#dP').onclick=function(){if(dI>0){dI--;drawD()}};
 $('#dN').onclick=function(){if(dI<dList.length-1){dI++;drawD()}};
 if(G)$('#dG').onclick=function(e){e.preventDefault();closeD();go('tricks');setTimeout(function(){var el=document.getElementById('tk'+gi);if(el)el.scrollIntoView()},80)};
 var gal=$('#gal');
 $('#gl').onclick=function(){gal.scrollLeft-=gal.clientWidth};
 $('#gr').onclick=function(){gal.scrollLeft+=gal.clientWidth};
 getGallery(p).then(function(arr){if(dList[dI]!==p)return;
  if(!arr.length){gal.innerHTML='<div class="ph"><span class="em">'+CATS[p.cat][0]+'</span></div>';$('#cap').textContent=NET?'No photo found – tap “More photos”.':'Photos unavailable right now – tap “More photos”.';return}
  gal.innerHTML=arr.map(function(x){return '<div class="ph" style="background-image:url(\''+x.u+'\')"></div>'}).join('');
  $('#gdots').innerHTML=arr.length>1?arr.map(function(_,i){return '<span class="'+(i?'':'on')+'"></span>'}).join(''):'';
  var cap=function(i){var x=arr[i];$('#cap').textContent='📷 '+(x.a||'')+' · via '+x.s+(p.cv&&x.s==='iNaturalist'?' · may show the parent/related species':'');$$('#gdots span').forEach(function(d,j){d.classList.toggle('on',j===i)})};
  cap(0);gal.onscroll=function(){cap(Math.min(arr.length-1,Math.round(gal.scrollLeft/gal.clientWidth)))}})}
$('#sheet').onclick=function(e){if(e.target.id==='sheet')closeD()};

var L={deck:'all',mode:'photo',p:null,flip:false,last:null,h:0};
function renderLearn(){var D=deck(L.deck),m=D.filter(function(p){return lv(p)>=3}).length;
 $('#v-learn').innerHTML='<div class="panel"><div class="sel">'+deckSel('lDeck')+'<select id="lMode"><option value="photo">📸 Photo → name</option><option value="name">🔤 Name → features</option></select></div><div class="prog"><div style="width:'+(D.length?m/D.length*100:0)+'%"></div></div><div class="meta" style="margin:6px 0 0">🏆 '+m+' / '+D.length+' mastered · tap the card to flip · missed cards come back more often</div></div><div id="fcWrap"></div>';
 $('#lDeck').value=L.deck;$('#lMode').value=L.mode;
 $('#lDeck').onchange=function(e){L.deck=e.target.value;renderLearn()};
 $('#lMode').onchange=function(e){L.mode=e.target.value;renderLearn()};
 var W=$('#fcWrap');if(!D.length){W.innerHTML='<p class="empty">No plants in this deck yet – ⭐ some favourites first!</p>';return}
 var p=L.p=pickW(D,L.last);L.last=p.id;L.flip=false;L.h=0;
 var front=L.mode==='photo'
  ?'<div class="ph load" data-id="'+attr(p.id)+'"></div><div class="lbl"><div class="bigname">Who am I? 🤔</div><div class="hint" id="hint">Tap the card to reveal</div><button class="btn" id="hintBtn">💡 Give me a clue</button></div>'
  :'<div class="lbl" style="padding:40px 14px"><div class="big">'+CATS[p.cat][0]+'</div><div class="bigname">'+p.common+'</div><div class="sci">'+p.sci+'</div><p class="hint">Picture it… which 3 features would you look for? Then tap to flip.</p></div>';
 W.innerHTML='<div class="flash"><div class="fc" id="fc"><div class="face front">'+front+'</div><div class="face back"><div class="ph load" data-id="'+attr(p.id)+'"></div><div class="pad"><div class="bigname">'+p.common+'</div><div class="sci">'+p.sci+'</div><div style="margin-top:10px">'+tipsHTML(p)+'</div>'+(p.hook?'<div class="hook">🧠 '+p.hook+'</div>':'')+'</div></div></div>'+
  '<div class="ans" id="ans" style="visibility:hidden"><button class="btn red" id="again">😅 Again</button><button class="btn p" id="got">😎 Got it!</button></div></div>';
 $$('#fcWrap .ph').forEach(loadPh);
 $('#fc').onclick=flip;
 var hb=$('#hintBtn');if(hb)hb.onclick=function(e){e.stopPropagation();var t=p.tips[L.h++];if(t)$('#hint').innerHTML+='<div>'+ico(t)+' '+stripP(t)+'</div>';if(L.h>=p.tips.length)hb.style.display='none'};
 $('#again').onclick=function(){S.box[p.id]=0;touch();save();stats();renderLearn();window.scrollTo(0,0)};
 $('#got').onclick=function(){var b=lv(p);S.box[p.id]=Math.min(5,b+1);S.xp+=2;if(b<3&&b+1>=3){confetti();toast('🏆 Mastered: '+p.common)}touch();save();stats();renderLearn();window.scrollTo(0,0)}}

var QZ={deck:'all',mode:'photo',done:true};
function renderQuiz(){var k=QZ.deck+'|'+QZ.mode;QZ.done=true;
 $('#v-quiz').innerHTML='<div class="panel center"><div class="big">🎯</div><h2>Plant Quiz</h2><p class="meta">10 questions. Wrong answers come from the same group, so look closely!</p><div class="sel" style="justify-content:center">'+deckSel('qDeck')+'<select id="qMode"><option value="photo">📸 Photo quiz</option><option value="clue">🔍 Clue quiz (no photo)</option></select></div><div class="row" style="justify-content:center"><button class="btn p" id="qGo">▶ Start quiz</button></div><p class="meta">Best score for this setup: '+(S.best[k]||0)+'/10</p></div>';
 $('#qDeck').value=QZ.deck;$('#qMode').value=QZ.mode;
 $('#qDeck').onchange=function(e){QZ.deck=e.target.value;renderQuiz()};
 $('#qMode').onchange=function(e){QZ.mode=e.target.value;renderQuiz()};
 $('#qGo').onclick=function(){if(!deck(QZ.deck).length){toast('That deck is empty!');return}
  if(!NET&&QZ.mode==='photo'){QZ.mode='clue';toast('Photos unavailable – using the clue quiz')}
  QZ.n=0;QZ.score=0;QZ.run=0;QZ.used={};QZ.missed=[];qNext()}}
function makeOpts(c){var pool=P.filter(function(p){return p.id!==c.id&&p.common!==c.common});
 var out=shuffle(pool.filter(function(p){return genus(p)===genus(c)})).slice(0,1);
 var cand=shuffle(pool.filter(function(p){return p.cat===c.cat})).concat(shuffle(pool));
 for(var i=0;i<cand.length&&out.length<3;i++){var p=cand[i];if(out.indexOf(p)<0&&!out.some(function(o){return o.common===p.common}))out.push(p)}
 return shuffle([c].concat(out))}
function qNext(){if(QZ.n>=10)return qEnd();
 var D=deck(QZ.deck).filter(function(p){return !QZ.used[p.id]});if(!D.length)D=deck(QZ.deck);
 var c=QZ.cur=pickW(D);QZ.used[c.id]=1;QZ.opts=makeOpts(c);QZ.done=false;QZ.n++;
 var body=QZ.mode==='photo'?'<div class="qimg"><div class="ph load" data-id="'+attr(c.id)+'"></div></div>':'<div class="panel" style="max-width:520px;margin:0 auto"><b>Which plant matches these clues?</b><div style="margin-top:8px">'+tipsHTML(c,true)+'</div></div>';
 $('#v-quiz').innerHTML='<div class="qtop"><span>Question '+QZ.n+'/10</span><span>✅ '+QZ.score+' · 🔥 '+QZ.run+'</span></div>'+body+'<div class="opts">'+QZ.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'"><b>'+o.common+'</b><i>'+o.sci+'</i></button>'}).join('')+'</div><div id="qFb"></div>';
 $$('#v-quiz .ph').forEach(loadPh);
 $$('.opt').forEach(function(b){b.onclick=function(){qAns(+b.getAttribute('data-i'))}});
 window.scrollTo(0,0)}
function qAns(i){if(QZ.done)return;QZ.done=true;var c=QZ.cur,o=QZ.opts[i],btns=$$('.opt');
 btns[QZ.opts.indexOf(c)].classList.add('ok');var right=o===c;
 if(right){QZ.score++;QZ.run++;S.xp+=10+(QZ.run>2?5:0);S.box[c.id]=Math.min(5,lv(c)+1);confetti()}
 else{btns[i].classList.add('no');QZ.run=0;QZ.missed.push(c);S.box[c.id]=0}
 touch();save();stats();
 $('#qFb').innerHTML=(QZ.mode==='clue'?'<div class="qimg" style="max-width:320px;margin:14px auto 0"><div class="ph load" data-id="'+attr(c.id)+'"></div></div>':'')+
  '<div class="hook" style="max-width:520px;margin:14px auto 0">'+(right?'🎉 Correct!'+(QZ.run>2?' 🔥 Streak bonus!':''):'❌ It was <b>'+c.common+'</b>.')+'<br>🧠 '+c.hook+'</div>'+
  '<div class="row" style="justify-content:center"><button class="btn" id="qInfo">📖 Details</button><button class="btn p" id="qNx">'+(QZ.n>=10?'See results 🏁':'Next ➜')+'</button></div>';
 $$('#qFb .ph').forEach(loadPh);
 $('#qInfo').onclick=function(){openD(c.id)};$('#qNx').onclick=qNext;
 try{$('#qNx').scrollIntoView({block:'center'})}catch(e){}}
function qEnd(){var k=QZ.deck+'|'+QZ.mode,old=S.best[k]||0,nb=QZ.score>old;S.best[k]=Math.max(old,QZ.score);save();QZ.done=true;
 var s=QZ.score,msg=s===10?'PERFECT! You are a Leaf Legend!':s>=8?'Brilliant work!':s>=5?'Growing nicely!':'Every expert started as a seedling!';
 if(s>=8)confetti(40);
 $('#v-quiz').innerHTML='<div class="panel center"><div class="big">'+(s>=8?'🏆':s>=5?'🌿':'🌱')+'</div><h2>'+s+' / 10</h2><p>'+msg+'</p>'+(nb?'<p><b>🎉 New best score!</b></p>':'<p class="meta">Best: '+S.best[k]+'/10</p>')+'<div class="row" style="justify-content:center"><button class="btn p" id="qAgain">🔁 Play again</button><button class="btn" id="qHome">⚙️ Change quiz</button></div></div>'+(QZ.missed.length?'<h3>📚 Revise these</h3><div class="grid" id="qMiss">'+QZ.missed.map(card).join('')+'</div>':'');
 $('#qAgain').onclick=function(){QZ.n=0;QZ.score=0;QZ.run=0;QZ.used={};QZ.missed=[];qNext()};
 $('#qHome').onclick=renderQuiz;
 var m=$('#qMiss');if(m){$$('#qMiss .ph').forEach(loadPh);var ml=QZ.missed.slice();m.onclick=function(e){var c=e.target.closest('.card');if(c)openD(c.getAttribute('data-id'),ml)}}
 window.scrollTo(0,0)}

 '<div class="tk"><h4>⚙️ About & settings</h4><p class="meta">Native plants of Canberra and the Southern Tablelands, from box-gum grassy woodland to the Brindabellas. Photos load live from iNaturalist (Wikipedia as backup) and are remembered on this device. Credits appear under each photo.</p><div class="row"><button class="btn red" id="reset">Reset my progress</button></div></div>';
