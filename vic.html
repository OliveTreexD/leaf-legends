<style>
:root{--bg:#f5f2e9;--ink:#1d2b1f;--mut:#6a786b;--g:#2f7d4a;--g2:#e3f1e6;--gold:#f4b400;--red:#d9534f;--sh:0 3px 12px rgba(0,0,0,.08);--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#2f7d4a,#3f9a5d);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:7px;box-shadow:var(--sh)}
header h1{font-size:1.15rem;margin:0;flex:1}
.stat{background:rgba(255,255,255,.2);border-radius:99px;padding:4px 9px;font-size:.8rem;white-space:nowrap}
.netbar{background:#fff3c4;border-bottom:2px solid #f4b400;padding:10px 14px;font-size:.88rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.netbar[hidden]{display:none}
main{max-width:1100px;margin:0 auto;padding:12px}
.view{display:none}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;display:flex;justify-content:space-around;border-top:1px solid #e4e0d4;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 12px;cursor:pointer}
nav button span{font-size:1.45rem}
nav button.on{color:var(--g);font-weight:700}
.search{width:100%;padding:13px 16px;border-radius:99px;border:2px solid #ddd8c8;font-size:1rem;background:#fff;outline:none;-webkit-appearance:none}
.search:focus{border-color:var(--g)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:#fff;border-radius:99px;padding:8px 13px;font:inherit;font-size:.85rem;box-shadow:var(--sh);cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--g);color:#fff}
.meta{font-size:.8rem;color:var(--mut);margin:2px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);cursor:pointer;position:relative;transition:transform .15s}
.card:active{transform:scale(.97)}
.ph{width:100%;padding-top:100%;background:#dde7da center/cover no-repeat;position:relative}
.ph .em{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:2.6rem}
.ph.load{background-image:linear-gradient(90deg,#dde7da 0,#eef4ec 50%,#dde7da 100%);background-size:200% 100%;animation:shim 1.2s infinite}
@keyframes shim{to{background-position:-200% 0}}
.card .t{padding:8px 10px 11px}.card b{display:block;font-size:.9rem;line-height:1.2}
.card i{display:block;font-size:.76rem;color:var(--mut);margin-top:3px;line-height:1.2}
.lvl{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;font-size:.66rem;padding:2px 7px;z-index:2}
.fv{position:absolute;top:6px;left:6px;font-size:1rem;z-index:2}
.potd{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#fff7df,#fff);border-radius:var(--r);padding:10px;box-shadow:var(--sh);margin-bottom:12px;cursor:pointer}
.potd .ph{width:88px;padding-top:88px;flex:none;border-radius:14px}
.potd small{color:#b07b00;font-weight:700;text-transform:uppercase;font-size:.68rem;letter-spacing:.6px}
.potd b{display:block}.potd i{color:var(--mut);font-size:.8rem}.potd p{margin:4px 0 0;font-size:.82rem}
.sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(15,25,15,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet-in{background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;position:relative}
@media(min-width:760px){.sheet{align-items:center}.sheet-in{border-radius:22px;max-height:90vh}}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#cfdccb;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}
.gal .ph{flex:0 0 100%;padding-top:75%;scroll-snap-align:center}
.gbtn{position:absolute;top:50%;margin-top:-18px;border:0;background:rgba(0,0,0,.45);color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.3rem;cursor:pointer}
.gbtn.l{left:8px}.gbtn.r{right:8px}
.galnav{display:flex;justify-content:center;gap:5px;padding:7px}
.galnav span{width:7px;height:7px;border-radius:50%;background:#bbb}.galnav span.on{background:var(--g)}
.cap{font-size:.66rem;color:var(--mut);text-align:center;padding:0 14px}
.x{position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:1.1rem;cursor:pointer}
.pad{padding:14px 18px 22px}
.badge{display:inline-block;background:var(--g2);color:var(--g);border-radius:99px;padding:3px 10px;font-size:.75rem;font-weight:700}
h2{margin:8px 0 2px;font-size:1.5rem}.sci{font-style:italic;color:var(--mut)}
.aka{font-size:.8rem;color:var(--mut);margin-top:4px}
h3{margin:18px 0 8px;font-size:1rem}
.tips{list-style:none;padding:0;margin:0}
.tips li{background:#fff;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--sh);font-size:.93rem;line-height:1.35;text-align:left;margin-bottom:8px}
.tips li span{font-size:1.25rem;line-height:1}
.hook{margin-top:14px;background:linear-gradient(135deg,#fff3c4,#ffe9a8);border-radius:16px;padding:12px 14px;font-size:.98rem;line-height:1.4}
.note{margin-top:10px;background:#ffe9e5;border-radius:14px;padding:10px 12px;font-size:.86rem}
.trick{margin-top:12px;background:var(--g2);border-radius:14px;padding:10px 12px;font-size:.88rem}
.trick a{color:var(--g);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border:0;border-radius:99px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;background:#fff;box-shadow:var(--sh);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:.9rem}
.btn.p{background:var(--g);color:#fff}.btn.gold{background:var(--gold);color:#3a2c00}.btn.red{background:var(--red);color:#fff}
.btn[disabled]{opacity:.35}
.nav2{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.dots5{letter-spacing:2px;color:var(--g)}
.panel{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.sel{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{font:inherit;padding:9px 12px;border-radius:12px;border:2px solid #ddd8c8;background:#fff;max-width:100%;color:var(--ink)}
.prog{height:10px;background:#e8e4d8;border-radius:99px;overflow:hidden;margin-top:10px}
.prog div{height:100%;background:linear-gradient(90deg,#4caf6e,#2f7d4a)}
.flash{max-width:520px;margin:0 auto}
.fc{cursor:pointer}
.face{background:#fff;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.fc .back{display:none}
.fc.flip .front{display:none}
.fc.flip .back{display:block;animation:pop .3s}
@keyframes pop{from{transform:scale(.95);opacity:.4}to{transform:none;opacity:1}}
.front .ph{padding-top:85%}
.back .ph{padding-top:62%}
.lbl{padding:14px;text-align:center}
.bigname{font-size:1.45rem;font-weight:800;margin:4px 0 2px}
.hint{font-size:.88rem;color:var(--mut);margin:6px 0}
.ans{display:flex;gap:10px;justify-content:center;margin-top:14px}
.ans .btn{flex:1;max-width:200px;justify-content:center;padding:14px}
.qimg{max-width:520px;margin:0 auto;border-radius:22px;overflow:hidden;box-shadow:var(--sh)}
.qimg .ph{padding-top:75%}
.opts{display:grid;gap:9px;max-width:520px;margin:14px auto 0}
.opt{border:0;background:#fff;border-radius:16px;padding:13px 14px;font:inherit;text-align:left;box-shadow:var(--sh);cursor:pointer;font-size:.95rem;color:var(--ink);width:100%}
.opt i{display:block;color:var(--mut);font-size:.8rem}
.opt.ok{background:#d6f5df;outline:3px solid #3fae63}
.opt.no{background:#fde0dc;outline:3px solid var(--red)}
.qtop{display:flex;justify-content:space-between;max-width:520px;margin:0 auto 10px;font-weight:700}
.center{text-align:center}.big{font-size:3rem}
.tk{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px}
.tk h4{margin:0 0 6px;font-size:1.05rem}.tk ul,.tk ol{margin:0;padding-left:20px;line-height:1.55;font-size:.92rem}
.rhyme{background:#fff3c4;border-radius:12px;padding:8px 10px;margin-top:8px;font-weight:600;font-size:.9rem}
#fx{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:99;overflow:hidden}
#fx span{position:absolute;top:-30px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1d2b1f;color:#fff;padding:10px 16px;border-radius:99px;font-size:.9rem;z-index:60}
.empty{text-align:center;color:var(--mut);padding:30px}
</style>

var GROUPS=[
{e:'🪵',t:'Eucalypts: read the bark',g:['Eucalyptus','Corymbia'],tips:['<b>Gum</b> – smooth bark shedding in ribbons or patches (manna gum, swamp gum, river red gum, snow gum).','<b>Box</b> – short, flaky grey or yellow-brown bark, often just on the lower trunk (yellow box, grey box, black box, red box).','<b>Ironbark</b> – rock-hard, black, deeply furrowed, never peels (red ironbark).','<b>Stringybark</b> – thick fibres you can pull off in strings (messmate, red stringybark).','<b>Peppermint</b> – fine, soft, interwoven bark and minty leaves (narrow-leaved peppermint).','<b>Half-barked</b> – rough stocking at the base, smooth above (mountain ash, mountain grey gum).'],r:'Gums are smooth, irons are tough, strings pull off, boxes are rough!'},
{e:'📜',t:'Paperbarks & bottlebrushes',g:['Melaleuca','Callistemon'],tips:['Papery bark peeling in layers (most species – moonah is the rough exception).','Bottlebrush flowers – the stem keeps growing leaves beyond the brush.','Old woody capsules hug the stem in rows like beads.','All Callistemons are now Melaleucas – same plants, new name.'],r:'Paper bark + brush + beads = Melaleuca.'},
{e:'🍵',t:'Tea-trees & kunzeas',g:['Leptospermum','Kunzea'],tips:['Small stiff leaves, often with a sharp point.','<b>Tea-trees</b> – white 5-petal flowers like tiny apple blossom, woody cups stay on the branches.','<b>Kunzea</b> – fluffy flowers with long stamens that stick out.','Woolly tea-tree = soft hairy leaves. Coast tea-tree = twisted grey trunks.'],r:'Apple blossom = tea-tree. Fluffy = kunzea.'},
{e:'💛',t:'Wattles',g:['Acacia'],tips:['Most leaves are phyllodes – flattened stalks with parallel veins, often with a small gland on the edge.','Black wattle and silver wattle have feathery fern-like leaves instead.','Flowers are fluffy BALLS or RODS – note which!','Prickly Moses and hedge wattle are spiny – look before you touch.'],r:'Balls or rods? Then check the pods.'},
{e:'🪥',t:'Protea family: grevilleas, hakeas, banksias',g:['Grevillea','Hakea','Banksia'],tips:['<b>Grevillea</b> – spider flowers with long hooked styles, soft pods.','<b>Hakea</b> – similar flowers but rock-hard woody beaked fruits that stay on the plant.','<b>Banksia</b> – flowers packed into a candle, leaves silver underneath on our local species.'],r:'Spider = Grevillea. Hard beak = Hakea. Candle = Banksia.'},
{e:'🎋',t:'She-oaks & native cypress',g:['Casuarina','Allocasuarina','Callitris','Exocarpos'],tips:['She-oak needles are really branchlets – the true leaves are tiny teeth in rings at each joint.','Count the teeth: black she-oak 6–8, river she-oak 8–10, drooping she-oak 9–13.','<b>Callitris</b> (native cypress) has tiny scale leaves and small round cones that split open.','<b>Cherry ballart</b> looks like a cypress but grows a red fleshy cherry stalk.'],r:'Count the teeth to name the she-oak.'},
{e:'🌲',t:'Cool rainforest & fern gully plants',g:['Nothofagus','Atherosperma','Pomaderris','Olearia','Pittosporum','Syzygium','Prostanthera'],tips:['<b>Myrtle beech</b> – tiny triangle toothed leaves, red new growth.','<b>Southern sassafras</b> – opposite leaves that smell of nutmeg.','<b>Hazel pomaderris</b> – rough leaves, felty underneath.','<b>Musk daisy-bush</b> – silver-backed leaves with a musky smell.','<b>Christmas bush</b> – minty leaves and white-mauve flowers in December.'],r:'Sniff the gully: nutmeg, musk and mint.'},
{e:'🔔',t:'Heaths & correas',g:['Epacris','Correa'],tips:['<b>Common heath</b> – small sharp leaves and tubular bells in pink, red or white. The Victorian floral emblem.','<b>Correas</b> – opposite leaves and tube-shaped bells made of 4 joined petals.','White correa = round grey leaves and white stars. Native fuchsia = red bells with green tips.'],r:'Bells everywhere: heaths are sharp, correas are soft.'},
{e:'🌼',t:'Daisies & everlastings',g:['Chrysocephalum','Xerochrysum','Leucochrysum','Rhodanthe','Brachyscome','Calocephalus','Craspedia','Pycnosorus','Microseris','Ozothamnus','Cassinia','Leucophyta'],tips:['A daisy flower is really a head of many tiny flowers.','<b>Everlastings</b> – papery bracts that crackle and last when dried.','<b>Billy-buttons and drumsticks</b> – perfect golden balls on tall stalks.','<b>Murnong</b> – a yellow dandelion-look flower that nods in bud.','<b>Cassinia and tree everlasting</b> – shrubs with flat clusters of tiny white heads.'],r:'Paper, buttons, balls and dandelions.'},
{e:'🌾',t:'Grasses vs sedges vs rushes',g:['Themeda','Poa','Rytidosperma','Austrostipa','Microlaena','Dichelachne','Chloris','Bothriochloa','Elymus','Phragmites','Spinifex','Carex','Ficinia','Gahnia','Lepidosperma','Juncus'],tips:['<b>Grasses</b> – hollow round stems with knee-like joints, leaves in two rows.','<b>Sedges</b> (Carex, Gahnia, Ficinia) – solid stems, often triangular, leaves in 3 rows.','<b>Rushes</b> (Juncus) – round, pithy stems with tiny 6-part flowers.','Kangaroo grass = rusty drooping heads. Wallaby grass = cotton-wool tufts. Spear-grass = long twisted awns.','Roll the stem between your fingers: triangle = sedge, round and no joints = rush, joints = grass.'],r:'Sedges have edges, rushes are round, grasses have knees all the way to the ground!'},
{e:'🪻',t:'Strappy plant showdown',g:['Lomandra','Dianella','Xanthorrhoea','Patersonia','Stypandra','Bulbine','Arthropodium','Diplarrena','Burchardia','Wurmbea'],tips:['<b>Lomandra</b> – leaf tip often has 2–3 tiny teeth, spiky cream or yellow flower heads.','<b>Dianella</b> – leaves fold into a V, blue star flowers then glossy blue-purple berries.','<b>Xanthorrhoea</b> – grass-tree: ball of fine stiff leaves, tall spear flower spike.','<b>Patersonia</b> – 3 purple petals. <b>Butterfly flag</b> – 3 white petals.','<b>Lilies</b> – bulbine (yellow stars), chocolate lily (purple, smells of chocolate), milkmaids (white stars).'],r:'Teeth = Lomandra. Blue berries = Dianella. Spear = grass-tree.'},
{e:'🌿',t:'Fern finder',g:['Dicksonia','Cyathea','Blechnum','Pteridium','Calochlaena','Adiantum','Asplenium','Polystichum','Doodia','Gleichenia','Histiopteris','Todea','Cheilanthes','Pyrrosia','Microsorum','Marsilea'],tips:['<b>Soft vs rough tree-fern</b> – soft = thick trunk of matted roots. Rough = slender trunk with knobbly stubs and prickly stalks.','<b>Fishbone water-fern</b> – fronds like a fish skeleton, black stalks.','<b>Maidenhair</b> – shiny black wiry stems + fan leaflets.','<b>Bracken</b> = harsh triangle on one stalk. <b>Ground-fern</b> = the soft look-alike.','<b>Mother shield-fern</b> – baby plants growing from buds near the frond tips.'],r:'Soft trunks hug, rough trunks prickle.'},
{e:'🫛',t:'Pea-flower family',g:['Hardenbergia','Kennedia','Glycine','Indigofera','Pultenaea','Dillwynia','Platylobium'],tips:['Flowers shaped like a little bonnet: a big flag petal, two wings and a boat-shaped keel.','Fruit = pods.','Many local peas are yellow and red – the egg-and-bacon look.','Purple = Hardenbergia. Scarlet runner = running postman. Dark red vine = dusky coral-pea.'],r:'Flag, wings, keel – then a pod.'},
{e:'🌺',t:'Orchids',g:['Dendrobium','Sarcochilus','Glossodia','Diuris','Pterostylis','Thelymitra','Caladenia'],tips:['Every orchid has one special petal: the lip.','<b>Greenhoods</b> – green hooded flowers. <b>Sun orchids</b> – blue flowers that open only in sunshine.','<b>Donkey and leopard orchids</b> – two upright petals like ears. <b>Pink fingers</b> – narrow finger petals.','Most Victorian orchids grow in the ground and appear in late winter–spring.'],r:'Hoods, ears, fingers and sun-lovers.'},
{e:'🌊',t:'Coastal survivors',g:['Carpobrotus','Disphyma','Tetragonia','Rhagodia','Atriplex','Myoporum','Sarcocornia'],tips:['Coastal plants fight salt, wind and sun.','<b>Fleshy leaves</b> store water – karkalla, pigface, bower spinach, glasswort.','<b>Silver or grey leaves</b> reflect sun – saltbush, cushion bush.','<b>Runners</b> bind sand – spinifex, karkalla.'],r:'Fleshy, silver or creeping = coastal survivor.'},
{e:'🍇',t:'Vine giveaways',g:['Clematis','Billardiera','Pandorea','Comesperma','Muehlenbeckia','Parsonsia'],tips:['Fluffy seed heads + opposite 3-part leaves = Clematis.','Trumpet flowers + pinnate leaves = wonga vine.','Wiry, almost leafless twiner with blue flowers = love creeper.','Hairy sausage berries = apple-berry. Long silky pods = silkpod.'],r:'Fluff, trumpets, love knots and sausages.'},

function tfetch(u){var c=window.AbortController?new AbortController():null;var t=setTimeout(function(){if(c)c.abort()},9000);

 if(pend[p.id]){for(var i=0;i<QQ.length;i++)if(QQ[i].p===p){QQ.push(QQ.splice(i,1)[0]);break}return pend[p.id]}
 pend[p.id]=new Promise(function(res){QQ.push({p:p,res:res});pump()});return pend[p.id]}
async function pump(){if(busy)return;busy=true;
 while(QQ.length){
  if(!NET){while(QQ.length){var x=QQ.pop();delete pend[x.p.id];x.res(null)}break}
  var job=QQ.pop(),ph=null,ok=true;
  try{ph=await findPhoto(job.p);fails=0}catch(e){ok=false;fails++;if(fails>=3){NET=false;showNet(true)}}
  if(ok){PC[job.p.id]=ph;savePC()}
  delete pend[job.p.id];job.res(ph);await sleep(ok?450:150)}
 busy=false}

 if(p.cv){var w=null;try{w=await wiki(p.sci.replace(/[‘’]/g,"'"))}catch(e){}if(w)return w}

var L={deck:'all',mode:'photo',p:null,flip:false,last:null,h:0};
function renderLearn(){var D=deck(L.deck),m=D.filter(function(p){return lv(p)>=3}).length;
 $('#v-learn').innerHTML='<div class="panel"><div class="sel">'+deckSel('lDeck')+'<select id="lMode"><option value="photo">📸 Photo → name</option><option value="name">🔤 Name → features</option></select></div><div class="prog"><div style="width:'+(D.length?m/D.length*100:0)+'%"></div></div><div class="meta" style="margin:6px 0 0">🏆 '+m+' / '+D.length+' mastered · tap the card to flip · missed cards come back more often</div></div><div id="fcWrap"></div>';
 $('#lDeck').value=L.deck;$('#lMode').value=L.mode;
 $('#lDeck').onchange=function(e){L.deck=e.target.value;renderLearn()};
 $('#lMode').onchange=function(e){L.mode=e.target.value;renderLearn()};
 var W=$('#fcWrap');if(!D.length){W.innerHTML='<p class="empty">No plants in this deck yet – ⭐ some favourites first!</p>';return}
 var p=L.p=pickW(D,L.last);L.last=p.id;L.flip=false;L.h=0;
 var front=L.mode==='photo'
  ?'<div class="ph load" data-id="'+attr(p.id)+'"></div><div class="lbl"><div class="bigname">Who am I? 🤔</div><div class="hint" id="hint">Tap the card to reveal</div><button class="btn" id="hintBtn">💡 Give me a clue</button></div>'
  :'<div class="lbl" style="padding:40px 14px"><div class="big">'+CATS[p.cat][0]+'</div><div class="bigname">'+p.common+'</div><div class="sci">'+p.sci+'</div><p class="hint">Picture it… which 3 features would you look for? Then tap to flip.</p></div>';
 W.innerHTML='<div class="flash"><div class="fc" id="fc"><div class="face front">'+front+'</div><div class="face back"><div class="ph load" data-id="'+attr(p.id)+'"></div><div class="pad"><div class="bigname">'+p.common+'</div><div class="sci">'+p.sci+'</div><div style="margin-top:10px">'+tipsHTML(p)+'</div>'+(p.hook?'<div class="hook">🧠 '+p.hook+'</div>':'')+'</div></div></div>'+
  '<div class="ans" id="ans" style="visibility:hidden"><button class="btn red" id="again">😅 Again</button><button class="btn p" id="got">😎 Got it!</button></div></div>';
 $$('#fcWrap .ph').forEach(loadPh);
 $('#fc').onclick=flip;
 var hb=$('#hintBtn');if(hb)hb.onclick=function(e){e.stopPropagation();var t=p.tips[L.h++];if(t)$('#hint').innerHTML+='<div>'+ico(t)+' '+stripP(t)+'</div>';if(L.h>=p.tips.length)hb.style.display='none'};
 $('#again').onclick=function(){S.box[p.id]=0;touch();save();stats();renderLearn();window.scrollTo(0,0)};
 $('#got').onclick=function(){var b=lv(p);S.box[p.id]=Math.min(5,b+1);S.xp+=2;if(b<3&&b+1>=3){confetti();toast('🏆 Mastered: '+p.common)}touch();save();stats();renderLearn();window.scrollTo(0,0)}}
function flip(){var fc=$('#fc');if(!fc)return;L.flip=!L.flip;fc.classList.toggle('flip',L.flip);if(L.flip)$('#ans').style.visibility='visible'}

/* ============ QUIZ ============ */
var QZ={deck:'all',mode:'photo',done:true};
function renderQuiz(){var k=QZ.deck+'|'+QZ.mode;QZ.done=true;
 $('#v-quiz').innerHTML='<div class="panel center"><div class="big">🎯</div><h2>Plant Quiz</h2><p class="meta">10 questions. Wrong answers come from the same group, so look closely!</p><div class="sel" style="justify-content:center">'+deckSel('qDeck')+'<select id="qMode"><option value="photo">📸 Photo quiz</option><option value="clue">🔍 Clue quiz (no photo)</option></select></div><div class="row" style="justify-content:center"><button class="btn p" id="qGo">▶ Start quiz</button></div><p class="meta">Best score for this setup: '+(S.best[k]||0)+'/10</p></div>';
 $('#qDeck').value=QZ.deck;$('#qMode').value=QZ.mode;
 $('#qDeck').onchange=function(e){QZ.deck=e.target.value;renderQuiz()};
 $('#qMode').onchange=function(e){QZ.mode=e.target.value;renderQuiz()};
 $('#qGo').onclick=function(){if(!deck(QZ.deck).length){toast('That deck is empty!');return}
  if(!NET&&QZ.mode==='photo'){QZ.mode='clue';toast('Photos unavailable – using the clue quiz')}
  QZ.n=0;QZ.score=0;QZ.run=0;QZ.used={};QZ.missed=[];qNext()}}
function makeOpts(c){var pool=P.filter(function(p){return p.id!==c.id&&p.common!==c.common});
 var out=shuffle(pool.filter(function(p){return genus(p)===genus(c)})).slice(0,1);
 var cand=shuffle(pool.filter(function(p){return p.cat===c.cat})).concat(shuffle(pool));
 for(var i=0;i<cand.length&&out.length<3;i++){var p=cand[i];if(out.indexOf(p)<0&&!out.some(function(o){return o.common===p.common}))out.push(p)}
 return shuffle([c].concat(out))}
function qNext(){if(QZ.n>=10)return qEnd();
 var D=deck(QZ.deck).filter(function(p){return !QZ.used[p.id]});if(!D.length)D=deck(QZ.deck);
 var c=QZ.cur=pickW(D);QZ.used[c.id]=1;QZ.opts=makeOpts(c);QZ.done=false;QZ.n++;
 var body=QZ.mode==='photo'?'<div class="qimg"><div class="ph load" data-id="'+attr(c.id)+'"></div></div>':'<div class="panel" style="max-width:520px;margin:0 auto"><b>Which plant matches these clues?</b><div style="margin-top:8px">'+tipsHTML(c,true)+'</div></div>';
 $('#v-quiz').innerHTML='<div class="qtop"><span>Question '+QZ.n+'/10</span><span>✅ '+QZ.score+' · 🔥 '+QZ.run+'</span></div>'+body+'<div class="opts">'+QZ.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'"><b>'+o.common+'</b><i>'+o.sci+'</i></button>'}).join('')+'</div><div id="qFb"></div>';
 $$('#v-quiz .ph').forEach(loadPh);
 $$('.opt').forEach(function(b){b.onclick=function(){qAns(+b.getAttribute('data-i'))}});
 window.scrollTo(0,0)}
function qAns(i){if(QZ.done)return;QZ.done=true;var c=QZ.cur,o=QZ.opts[i],btns=$$('.opt');
 btns[QZ.opts.indexOf(c)].classList.add('ok');var right=o===c;
 if(right){QZ.score++;QZ.run++;S.xp+=10+(QZ.run>2?5:0);S.box[c.id]=Math.min(5,lv(c)+1);confetti()}
 else{btns[i].classList.add('no');QZ.run=0;QZ.missed.push(c);S.box[c.id]=0}
 touch();save();stats();
 $('#qFb').innerHTML=(QZ.mode==='clue'?'<div class="qimg" style="max-width:320px;margin:14px auto 0"><div class="ph load" data-id="'+attr(c.id)+'"></div></div>':'')+
  '<div class="hook" style="max-width:520px;margin:14px auto 0">'+(right?'🎉 Correct!'+(QZ.run>2?' 🔥 Streak bonus!':''):'❌ It was <b>'+c.common+'</b>.')+'<br>🧠 '+c.hook+'</div>'+
  '<div class="row" style="justify-content:center"><button class="btn" id="qInfo">📖 Details</button><button class="btn p" id="qNx">'+(QZ.n>=10?'See results 🏁':'Next ➜')+'</button></div>';
 $$('#qFb .ph').forEach(loadPh);
 $('#qInfo').onclick=function(){openD(c.id)};$('#qNx').onclick=qNext;
 try{$('#qNx').scrollIntoView({block:'center'})}catch(e){}}
function qEnd(){var k=QZ.deck+'|'+QZ.mode,old=S.best[k]||0,nb=QZ.score>old;S.best[k]=Math.max(old,QZ.score);save();QZ.done=true;
 var s=QZ.score,msg=s===10?'PERFECT! You are a Leaf Legend!':s>=8?'Brilliant work!':s>=5?'Growing nicely!':'Every expert started as a seedling!';
 if(s>=8)confetti(40);
 $('#v-quiz').innerHTML='<div class="panel center"><div class="big">'+(s>=8?'🏆':s>=5?'🌿':'🌱')+'</div><h2>'+s+' / 10</h2><p>'+msg+'</p>'+(nb?'<p><b>🎉 New best score!</b></p>':'<p class="meta">Best: '+S.best[k]+'/10</p>')+'<div class="row" style="justify-content:center"><button class="btn p" id="qAgain">🔁 Play again</button><button class="btn" id="qHome">⚙️ Change quiz</button></div></div>'+(QZ.missed.length?'<h3>📚 Revise these</h3><div class="grid" id="qMiss">'+QZ.missed.map(card).join('')+'</div>':'');
 $('#qAgain').onclick=function(){QZ.n=0;QZ.score=0;QZ.run=0;QZ.used={};QZ.missed=[];qNext()};
 $('#qHome').onclick=renderQuiz;
 var m=$('#qMiss');if(m){$$('#qMiss .ph').forEach(loadPh);var ml=QZ.missed.slice();m.onclick=function(e){var c=e.target.closest('.card');if(c)openD(c.getAttribute('data-id'),ml)}}
 window.scrollTo(0,0)}

/* ============ TRICKS ============ */
function renderTricks(){
 $('#v-tricks').innerHTML='<div class="tk" style="background:linear-gradient(135deg,#e3f1e6,#fff)"><h4>🧭 The 4-step ID method</h4><ol>'+
 '<li><b>🌳 Shape</b> – tree, shrub, groundcover, grass-like, vine, fern or palm?</li>'+
 '<li><b>🍃 Leaves</b> – opposite, alternate or whorled? Whole or divided? Crush and sniff!</li>'+
 '<li><b>🪵 Bark & stems</b> – smooth, papery, stringy, furrowed, corky, prickly? Grass stems: triangle, round or jointed?</li>'+
 '<li><b>🌸 Flowers & fruit</b> – ball, rod, brush, pea, bell, star? What\'s left behind: gumnuts, pods, berries, cones?</li></ol>'+
 '<div class="rhyme">🎵 Learn the GROUP first (below), then the species. It halves the work!</div></div>'+
 GROUPS.map(function(G,i){return '<div class="tk" id="tk'+i+'"><h4>'+G.e+' '+G.t+'</h4><ul>'+G.tips.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul><div class="rhyme">🎵 '+G.r+'</div><div class="row"><button class="btn" data-g="'+i+'">See these plants ('+P.filter(function(p){return G.g.indexOf(genus(p))>-1}).length+') →</button></div></div>'}).join('')+
 '<div class="tk"><h4>⚙️ About & settings</h4><p class="meta">Victorian indigenous plants. Photos load live from iNaturalist (Wikipedia as backup) and are remembered on this device. Credits appear under each photo.</p><div class="row"><button class="btn red" id="reset">Reset my progress</button></div></div>';
 $$('[data-g]').forEach(function(b){b.onclick=function(){fGroup=GROUPS[+b.getAttribute('data-g')];fText='';$('#q').value='';go('explore')}});
 $('#reset').onclick=function(){if(confirm('Reset all progress, XP and favourites?')){S.box={};S.fav={};S.xp=0;S.best={};S.streak=0;S.last='';save();stats();toast('Progress reset 🌱')}}}

/* ============ NAV & INIT ============ */
function go(v){V=v;
 $$('.view').forEach(function(x){x.classList.toggle('on',x.id==='v-'+v)});
 $$('nav button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===v)});
 ({explore:renderExplore,learn:renderLearn,quiz:renderQuiz,tricks:renderTricks})[v]();window.scrollTo(0,0)}
$$('nav button').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-v'))}});
document.addEventListener('keydown',function(e){
 if($('#sheet').classList.contains('open')){if(e.key==='Escape')closeD();if(e.key==='ArrowRight'&&dI<dList.length-1){dI++;drawD()}if(e.key==='ArrowLeft'&&dI>0){dI--;drawD()}return}
 if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
 if(V==='learn'&&$('#fc')){if(e.key===' '){e.preventDefault();flip()}if(L.flip&&e.key==='1')$('#again').click();if(L.flip&&e.key==='2')$('#got').click()}
 if(V==='quiz'&&!QZ.done&&/^[1-4]$/.test(e.key))qAns(+e.key-1)});
stats();renderExplore();
</script>
</body>
</html>
